general {
    no_fade_in = true
    grace = 0
    disable_loading = true
}

background {
    monitor =
    color = rgb(000000)
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(ffffffee)
    inner_color = rgb(000000)
    font_color = rgb(ffffff)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 0
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ffffff)
    font_size = 64
    font_family = Sans
    position = 0, 80
    halign = center
    valign = center
}

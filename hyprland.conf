# --- SYSTEM SETTINGS (AMD RX 570) -------------------------------------------------
env = LIBVA_DRIVER_NAME,radeonsi
env = DRI_PRIME,0 # This decides what gpu is being used (ie. 0 is RX 570, 1 is GTX 1050 Ti)
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# --- MONITOR CONFIGURATION --------------------------------------------------------

monitor=DP-1, 1920x1080@200, 0x0, 1                                                     # FHD 200hz Non-HDR
#monitor=DP-1e, 1920x1080@200, 0x0, 1, bitdepth, 10, cm, hdr, sdrbrightness, 1.3        # FHD 200hz HDR
#monitor = DP-1, modeline 203.25 1280 1328 1360 1440 720 723 728 785, 0x0, 0.8          # HD 180hz Non-HDR

# --- STARTUP / AUTO-EXEC ----------------------------------------------------------

exec-once = /usr/bin/gnome-keyring-daemon --start --components=pkcs11,secrets,ssh
exec-once = mako # Notifilication daemon
exec-once = wl-paste --type text --watch cliphist store # Clipboard for text
exec-once = wl-paste --type image --watch cliphist store # Clipboard for images
exec-once = easyeffects --gapplication-service # Audio I/O Effects

# --- LOOK & FEEL ------------------------------------------------------------------

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1
    col.active_border = rgba(ffffffee)
    col.inactive_border = rgba(595959ee)
    resize_on_border = true
    layout = dwindle
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(000000)
    vrr = 0
}

animations {
    enabled = true
    animation = windows, 0
}

decoration {
    rounding = 0
}

# --- INPUT SETTINGS --------------------------------------------------------------

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

# --- KEYBINDINGS -----------------------------------------------------------------

$mod = SUPER

# Terminal & Apps
bind = $mod, Return, exec, kitty
bind = $mod, e, exec, thunar
bind = $mod, d, exec, pkill tofi || tofi-drun --drun-launch=true

# Clipboard history
bind = $mod, c, exec, pkill tofi || cliphist list | tofi | cliphist decode | wl-copy

# Window Management
bind = $mod, q, killactive
bind = $mod SHIFT, q, exec, kill -9 $(hyprctl activewindow | grep 'pid:' | awk '{print $2}')
bind = $mod, f, fullscreen, 0
bind = $mod SHIFT, space, togglefloating

# Focus movement
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Screenshot | Loads into Cliphist
bind = , Print, exec, grim -g "$(slurp)" - | tee ~/Pictures/screenshot-$(date +%s).png | wl-copy
bind = SHIFT, Print, exec, grim - | tee ~/Pictures/screenshot-$(date +%s).png | wl-copy

# --- RESIZE MODE -----------------------------------------------------------------

bind = $mod, r, submap, resize
submap = resize
  binde = , left,  resizeactive, -10 0
  binde = , right, resizeactive, 10 0
  binde = , up,    resizeactive, 0 -10
  binde = , down,  resizeactive, 0 10
  bind = , return, submap, reset
  bind = , escape, submap, reset
submap = reset

# --- WORKSPACES ------------------------------------------------------------------

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# --- MULTIMEDIA / SYSTEM ---------------------------------------------------------

bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- LOCK & EXIT -----------------------------------------------------------------

bind = $mod, l, exec, hyprlock
bind = $mod SHIFT, e, exec, hyprctl dispatch exit

# --- WINDOW RULES -----------------------------------------------------------------

windowrule = suppress_event maximize, match:class .*
windowrule = no_focus 1, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
